name: Release de tradução

on:
  workflow_dispatch:
    inputs:
      jogo:
        description: Pasta do jogo em projetos/
        type: choice
        options:
          - garden-of-witches
          - the-wolf-among-us
      versao:
        description: "Versão da tradução (ex.: v1.0)"
        required: true
        default: v1.0
      steam_build:
        description: "Steam build suportado (ex.: 25225196)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      JOGO: ${{ inputs.jogo }}
      BUILD: ${{ inputs.steam_build }}
      TAG: ${{ inputs.jogo }}-${{ inputs.versao }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller==6.22.3

      - name: Gerar instalador e zip
        working-directory: projetos/${{ inputs.jogo }}
        run: python build.py --steam-build=${{ inputs.steam_build }}

      - name: Separar arquivos e calcular SHA-256
        shell: bash
        run: |
          mkdir assets
          cp projetos/$JOGO/releases/steam-build-$BUILD/* assets/
          cd assets
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Atestar origem do build (Sigstore)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            assets/*.exe
            assets/*.zip
            assets/SHA256SUMS.txt

      - name: Enviar ao VirusTotal
        id: vt
        if: env.VT_API_KEY != ''
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            assets/*.exe
            assets/*.zip

      - name: Publicar release
        shell: bash
        env:
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          case "$JOGO" in
            garden-of-witches) NOME="Garden of Witches" ;;
            the-wolf-among-us) NOME="The Wolf Among Us" ;;
            *) NOME="$JOGO" ;;
          esac
          REPO="${{ github.repository }}"
          {
            echo "## $NOME — Tradução PT-BR ${{ inputs.versao }}"
            echo
            echo "Compatível com a versão Steam **build $BUILD**. Baixe o \`.exe\` (instalador) ou o \`.zip\` (instalador + código-fonte + LEIA-ME)."
            echo
            echo "Gerado automaticamente pelo GitHub Actions a partir do commit [\`${GITHUB_SHA:0:7}\`](https://github.com/$REPO/commit/$GITHUB_SHA) — [log do build]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "### SHA-256"
            echo '```'
            cat assets/SHA256SUMS.txt
            echo '```'
            echo
            echo "### Como verificar"
            echo '- PowerShell: `Get-FileHash .\arquivo.exe -Algorithm SHA256` e compare com a lista acima.'
            echo "- Origem do build: \`gh attestation verify arquivo.exe --repo $REPO\`"
            if [ -n "$VT_ANALYSIS" ]; then
              echo
              echo "### VirusTotal"
              echo "$VT_ANALYSIS" | tr ',' '\n' | while IFS='=' read -r f url; do
                echo "- [$(basename "$f")]($url)"
              done
            fi
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" assets/* --title "$NOME — Tradução PT-BR ${{ inputs.versao }} (Steam build $BUILD)" --notes-file notes.md
          fi
